name: CI

env:
  POETRY_VERSION: '2.2.1'

on:
  push:
    branches: [main, phase/**]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install Poetry
        run: |
          python -m pip install --upgrade pip
          pip install "poetry==$POETRY_VERSION"
      - name: Install locked dependencies
        run: poetry install --no-interaction
      - name: Run Ruff
        run: poetry run ruff check .
      - name: Run Black
        run: poetry run black . --check --diff
      - name: Run MyPy
        run: poetry run mypy api worker shared

  test:
    name: Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        # pgvector, not plain postgres: the migration chain enables the vector extension,
        # so on the stock image every migration run fails at q2r3s4_pgvector.
        image: pgvector/pgvector:pg15
        env:
          POSTGRES_USER: procuresignal
          POSTGRES_PASSWORD: procuresignal
          POSTGRES_DB: procuresignal
        options: >-
          --health-cmd "pg_isready -U procuresignal"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install Poetry
        run: pip install "poetry==$POETRY_VERSION"
      - name: Install locked dependencies
        run: poetry install --no-interaction
      - name: Run tests
        run: >-
          poetry run pytest tests/ -v
          --cov=api --cov=worker --cov=shared
          --cov-report=term --cov-report=xml --cov-fail-under=85
        env:
          DATABASE_URL: postgresql+asyncpg://procuresignal:procuresignal@localhost:5432/procuresignal
      # Separate step, because REQUIRE_POSTGRES=1 turns a skip into a failure. Folding it
      # into the run above would let the whole suite pass having verified nothing
      # database-specific, which is how six unusable Alembic revisions reached main.
      - name: Verify against real PostgreSQL
        run: poetry run pytest tests/postgres -v --no-cov
        env:
          TEST_DATABASE_URL: postgresql+asyncpg://procuresignal:procuresignal@localhost:5432/postgres
          REQUIRE_POSTGRES: '1'
      # A gate, not a dashboard: below the floor committed in the fixture this exits
      # non-zero and the build stops. Lexical only, because hybrid retrieval needs an
      # embedding provider — a build that spends money on every push and depends on a
      # third party being reachable is a build somebody eventually disables. Run
      # `scripts/evaluate_search.py --hybrid` locally before a release; the lexical gate
      # is blind to ranking regressions that the hybrid one catches.
      - name: Check search has not regressed
        run: poetry run python scripts/evaluate_search.py
        env:
          TEST_DATABASE_URL: postgresql+asyncpg://procuresignal:procuresignal@localhost:5432/postgres
      - name: Verify the shared Redis rate limit
        run: poetry run pytest tests/integration/test_redis_backend.py -v --no-cov
        env:
          REDIS_URL: redis://localhost:6379/0
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      # ci, not install: install resolves fresh versions and would verify something
      # other than what is actually shipped.
      - name: Install locked dependencies
        run: npm ci
      - name: Run tests
        run: npm run test:run
      - name: Type check
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Production build
        run: npm run build
      # Turbopack, the default builder in Next 16, does not emit .next/types, so the
      # build above never checks that a page's props satisfy its generated route
      # contract. A dynamic route declaring synchronous params passed CI and failed
      # under webpack. This step is the one that catches it.
      - name: Verify route type contracts
        run: npm run verify:routes

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install Poetry
        run: pip install "poetry==$POETRY_VERSION"
      - name: Export the locked dependency set
        run: |
          poetry self add poetry-plugin-export
          poetry export --without-hashes --format requirements.txt --output requirements-audit.txt
      # Blocking on purpose. A non-blocking security job is one everybody learns to
      # skim past. If it proves noisy, the honest answer is a dated ignore list, not
      # a green tick that means nothing.
      - name: Audit Python dependencies
        run: |
          pip install pip-audit
          IGNORES=$(sed 's/#.*//; /^[[:space:]]*$/d' .github/pip-audit-ignore.txt \
            | sed 's/^/--ignore-vuln /' | tr '\n' ' ')
          # Ignore flags before --requirement: pip-audit treats a trailing argument
          # after -r as a positional project path and refuses to run.
          pip-audit --strict $IGNORES --requirement requirements-audit.txt
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Audit npm dependencies
        working-directory: frontend
        run: npm audit --audit-level=high

  build:
    name: Build Docker images
    runs-on: ubuntu-latest
    needs: [lint, test, frontend]
    steps:
      - uses: actions/checkout@v6
      - name: Build API image
        run: docker build -t procuresignal-api:latest -f Dockerfile.api .
      - name: Build Worker image
        run: docker build -t procuresignal-worker:latest -f Dockerfile.worker .
      - name: Build Frontend image
        run: docker build -t procuresignal-frontend:latest frontend
      - name: Test API image
        run: docker run --rm --entrypoint uvicorn procuresignal-api:latest --help
      - name: Test Worker image
        run: docker run --rm --entrypoint celery procuresignal-worker:latest --help
      - name: Test Frontend image
        run: |
          container_id="$(docker run --detach --publish 3000:3000 procuresignal-frontend:latest)"
          cleanup() {
            docker logs "$container_id"
            docker rm --force "$container_id"
          }
          trap cleanup EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error http://localhost:3000/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          echo "Frontend did not become ready within 30 seconds" >&2
          exit 1
