name: CI

env:
  POETRY_VERSION: '2.2.1'

on:
  push:
    branches: [main, phase/**]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Install Poetry
        run: |
          python -m pip install --upgrade pip
          pip install "poetry==$POETRY_VERSION"
      - name: Install locked dependencies
        run: poetry install --no-interaction
      - name: Run Ruff
        run: poetry run ruff check .
      - name: Run Black
        run: poetry run black . --check --diff
      - name: Run MyPy
        run: poetry run mypy api worker shared

  test:
    name: Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: procuresignal
          POSTGRES_PASSWORD: procuresignal
          POSTGRES_DB: procuresignal
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Install Poetry
        run: pip install "poetry==$POETRY_VERSION"
      - name: Install locked dependencies
        run: poetry install --no-interaction
      - name: Run tests
        run: poetry run pytest tests/ -v --cov=api --cov=worker --cov=shared --cov-report=xml
        env:
          DATABASE_URL: postgresql+asyncpg://procuresignal:procuresignal@localhost:5432/procuresignal
          REDIS_URL: redis://localhost:6379/0
      - name: Upload coverage
        uses: codecov/codecov-action@v3
        with:
          files: ./coverage.xml
          flags: unittests
          fail_ci_if_error: false

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      # ci, not install: install resolves fresh versions and would verify something
      # other than what is actually shipped.
      - name: Install locked dependencies
        run: npm ci
      - name: Run tests
        run: npm run test:run
      - name: Type check
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Production build
        run: npm run build

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Install Poetry
        run: pip install "poetry==$POETRY_VERSION"
      - name: Export the locked dependency set
        run: |
          poetry self add poetry-plugin-export
          poetry export --without-hashes --format requirements.txt --output requirements-audit.txt
      # Blocking on purpose. A non-blocking security job is one everybody learns to
      # skim past. If it proves noisy, the honest answer is a dated ignore list, not
      # a green tick that means nothing.
      - name: Audit Python dependencies
        run: |
          pip install pip-audit
          IGNORES=$(sed 's/#.*//; /^[[:space:]]*$/d' .github/pip-audit-ignore.txt \
            | sed 's/^/--ignore-vuln /' | tr '\n' ' ')
          # Ignore flags before --requirement: pip-audit treats a trailing argument
          # after -r as a positional project path and refuses to run.
          pip-audit --strict $IGNORES --requirement requirements-audit.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Audit npm dependencies
        working-directory: frontend
        run: npm audit --audit-level=high

  build:
    name: Build Docker images
    runs-on: ubuntu-latest
    needs: [lint, test, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Build API image
        run: docker build -t procuresignal-api:latest -f Dockerfile.api .
      - name: Build Worker image
        run: docker build -t procuresignal-worker:latest -f Dockerfile.worker .
      - name: Test API image
        run: docker run --rm --entrypoint uvicorn procuresignal-api:latest --help
      - name: Test Worker image
        run: docker run --rm --entrypoint celery procuresignal-worker:latest --help
